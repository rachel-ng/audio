name: 𓂈

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: checkout repo
      uses: actions/checkout@v4

    - name: git pull
      run: |-
        git pull

    - name: setup python
      uses: actions/setup-python@v5
      with:
        python-version: 3.13

    - name: pip caching
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/src/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: pip install
      run: |
        python -m pip install -r src/requirements.txt

    - name: rename files
      run: |-
        python src/audio_files.py ./ --undo
        python src/audio_files.py ./

    - name: push if changed
      run: |-
        git config --global user.email "rng+rng@stuy.edu"
        git config --global user.name "𓆙"

        git add -A

        if git diff --cached --quiet; then
          echo "× 𓂈"
        else
          git commit -m "𓂈"
          git push
        fi
